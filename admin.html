<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | World Insight</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-head"><div class="wrap">
  <a href="index.html" class="brand">World<span>Insight</span><small>Owner Dashboard</small></a>
</div></header>

<div class="admin-shell">

  <div class="admin-card" id="login-card">
    <h2>Sign In</h2>
    <p style="color:var(--text-mute);font-size:14px;">This dashboard is private. Only the owner account created in Supabase can sign in — there is no public sign-up.</p>
    <form id="login-form">
      <div class="field"><label for="login-email">Email</label><input type="email" id="login-email" required></div>
      <div class="field"><label for="login-password">Password</label><input type="password" id="login-password" required></div>
      <button class="btn" type="submit">Sign In</button>
      <div class="admin-msg" id="login-msg"></div>
    </form>
  </div>

  <div class="admin-card" id="dashboard-card" style="display:none;">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div>Signed in as <strong id="admin-email"></strong></div>
      <button class="btn ghost" id="logout-btn">Sign Out</button>
    </div>
  </div>

  <div class="admin-card" id="editor-card" style="display:none;">
    <h2 id="editor-title">Write a New Article</h2>
    <form id="post-form">
      <input type="hidden" id="f-slug">
      <input type="hidden" id="f-existing-image">
      <div class="field"><label for="f-title">Title</label><input type="text" id="f-title" required></div>
      <div class="field"><label for="f-category">Category</label>
        <select id="f-category">
          <option>World</option>
          <option>Politics</option>
          <option>Business</option>
          <option>Technology</option>
          <option>Culture</option>
        </select>
      </div>
      <div class="field"><label for="f-excerpt">Short Excerpt (shown on homepage cards)</label><textarea id="f-excerpt" style="min-height:80px;" maxlength="200"></textarea></div>
      <div class="field"><label for="f-image">Cover Photo</label><input type="file" id="f-image" accept="image/*"></div>
      <div class="field"><label for="f-content">Article Text</label><textarea id="f-content" placeholder="Write your article here. Leave a blank line between paragraphs." required></textarea></div>
      <div class="field"><label><input type="checkbox" id="f-published" checked style="width:auto;display:inline-block;margin-right:8px;">Published (visible to readers)</label></div>
      <button class="btn" type="submit" id="submit-btn">Publish Article</button>
      <button class="btn ghost" type="button" id="cancel-edit-btn" style="display:none;">Cancel Edit</button>
      <div class="admin-msg" id="editor-msg"></div>
    </form>
  </div>

  <div class="admin-card" id="list-card" style="display:none;">
    <h2>Your Articles</h2>
    <div id="my-posts"></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
